name: CI

# À chaque push et pull request : lint, tests (avec une base PostgreSQL
# éphémère pour les tests d'intégration) puis construction de l'image de
# l'API et vérification qu'elle démarre.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer ruff (même version qu'en local)
        run: pip install ruff==0.17.2
      - name: Lint
        run: ruff check .

  tests:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shoppulse
          POSTGRES_DB: shoppulse_test
          # Base jetable de la CI : aucun mot de passe à stocker.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoppulse -d shoppulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: shoppulse
      POSTGRES_DB: shoppulse_test
      SHOPPULSE_TEST_DB: shoppulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer PyTorch (version CPU) puis le projet
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dashboard,dev]"
      - name: Tests unitaires, de données et d'intégration
        run: pytest --cov=shoppulse --cov-report=term-missing --cov-fail-under=50

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de l'API
        run: docker build -f infra/Dockerfile -t shoppulse-api .
      - name: Vérifier que l'API démarre (sans modèles, en mode dégradé)
        run: |
          docker run -d --name api -p 8000:8000 shoppulse-api
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"status"'
          curl -fsS http://localhost:8000/openapi.json | grep -q '/predict/delay'
          docker logs api
          docker rm -f api

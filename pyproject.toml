[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppulse"
version = "0.1.0"
description = "ShopPulse : plateforme data & IA (mission flash DIA2)"
requires-python = ">=3.11"
# Socle : package, modèles servis et API (c'est ce qu'installe l'image
# Docker). Les outils lourds sont dans les groupes optionnels ci-dessous.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "threadpoolctl>=3.5",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
pipeline = ["prefect>=3.4,<4", "torch>=2.4"]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]
notebooks = [
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.13",
]
dev = [
    "ruff==0.17.2",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests qui ont besoin de PostgreSQL (base de test dédiée)"]

[tool.coverage.run]
source = ["shoppulse"]

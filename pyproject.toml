[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppulse"
version = "0.1.0"
description = "ShopPulse : plateforme data & IA (mission flash DIA2)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "prefect>=3.4,<4",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "pytest-cov>=5"]
notebooks = [
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py311"

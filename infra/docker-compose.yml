services:
  postgres:
    image: postgres:16-alpine
    container_name: shoppulse-postgres
    env_file: ../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API des modèles : lancer d'abord les pipelines (models/ rempli), puis
  #   docker compose -f infra/docker-compose.yml up -d --build api
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: shoppulse-api
    container_name: shoppulse-api
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro

volumes:
  pgdata:
